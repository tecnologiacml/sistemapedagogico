{% extends "base.html" %}
{% block titulo %}Excluir aluno · Sistema Pedagógico{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-3">Excluir aluno</h1>
<form method="post" class="card card-body shadow-sm">
  {% csrf_token %}
  <p>Tem certeza que deseja excluir <strong>{{ object.nome }}</strong>? Esta ação não pode ser desfeita.</p>
  <div>
    <button class="btn btn-danger">Excluir</button>
    <a class="btn btn-secondary" href="{% url 'alunos:detalhe' object.pk %}">Cancelar</a>
  </div>
</form>
{% endblock %}
